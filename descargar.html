  var FUENTE = ((new URLSearchParams(location.search)).get('utm_source') || 'directo').trim().toLowerCase().slice(0, 100);

  var done = false;
  function go() {
    if (done) return;
    done = true;
    // replace: esta página no queda en el historial, así "Atrás" no vuelve a disparar la descarga
    location.replace(PDF_FILE);
  }

  // 1) Registrar la descarga en GTM/GA4. GTM llama a eventCallback cuando terminan las etiquetas de este evento.
  dataLayer.push({
    event: 'report_download',
    report_name: REPORT_NAME,
    traffic_source: FUENTE,
    lead_status: 'directo',
    eventCallback: go,
    eventTimeout: 1500
  });

  // 2) Respaldo: si GTM está bloqueado (bloqueador de anuncios) el callback nunca se ejecuta.
  setTimeout(go, 2000);
})();
</script>
</body>
</html>
